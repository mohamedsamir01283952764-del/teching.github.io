<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الفيزياء الاحترافية 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --secondary: #64748b; --success: #059669;
            --error: #dc2626; --bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b;
        }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; transition: all 0.2s ease; }
        body { background: var(--bg); margin: 0; color: var(--text-main); height: 100vh; overflow: hidden; }

        #login-screen {
            position: fixed; inset: 0; background: linear-gradient(135deg, #1e3a8a, #2563eb);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-card {
            background: white; padding: 2.5rem; border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); width: 90%; max-width: 400px; text-align: center;
        }
        .login-card input {
            width: 100%; padding: 12px; margin: 1.5rem 0; border: 2px solid #e2e8f0;
            border-radius: 0.75rem; font-size: 1rem; text-align: center; outline: none;
        }

        #main-app { display: none; height: 100vh; grid-template-columns: 300px 1fr; }

		/* تعديلات السايد بار */
		/* السايد بار في الكمبيوتر */
		.sidebar { 
			background: var(--card-bg); 
			border-left: 1px solid #e2e8f0; 
			display: flex; 
			flex-direction: column; 
			height: 100vh; /* لازم نثبت الطول بطول الشاشة */
			overflow: hidden; /* نمنع السكرول الخارجي */
		}

		.sidebar-header { 
			padding: 1.2rem; 
			background: var(--primary); 
			color: white; 
			font-weight: 700; 
			text-align: center;
			flex-shrink: 0; /* نمنع الهيدر إنه ينضغط */
		}

		.nav-scroll { 
			flex: 1; 
			overflow-y: auto !important; /* تفعيل السكرول الطولي */
			padding: 1rem;
			scrollbar-width: thin; /* شكل سكرول شيك في فايرفوكس */
			scrollbar-color: var(--primary) transparent;
		}

		/* شكل السكرول بار في جوجل كروم (Webkit) */
		.nav-scroll::-webkit-scrollbar {
			width: 6px;
		}
		.nav-scroll::-webkit-scrollbar-thumb {
			background-color: var(--primary);
			border-radius: 10px;
		}
		.nav-scroll::-webkit-scrollbar-track {
			background: transparent;
		}

		.nav-grid { 
			display: grid; 
			grid-template-columns: repeat(4, 1fr); 
			gap: 0.5rem;
			padding-bottom: 20px; /* مساحة تحت آخر سؤال */
		}
        .q-dot {
            aspect-ratio: 1; border: 1px solid #cbd5e1; border-radius: 0.5rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-weight: 500; background: #fff;
        }
        .q-dot.active { border: 2px solid var(--primary); color: var(--primary); background: #eff6ff; }
        .q-dot.correct { background: var(--success) !important; color: white; border: none; }
        .q-dot.wrong { background: var(--error) !important; color: white; border: none; }

        .timer-box {
            background: #fee2e2; color: #dc2626; padding: 10px 20px;
            border-radius: 50px; font-weight: 800; font-size: 1.2rem;
            margin-bottom: 1.5rem; border: 2px solid #fecaca;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; max-width: 300px;
        }

        .content { flex: 1; padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding-bottom: 100px; }
        .quiz-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; }
        
        .question-card {
            background: white; border-radius: 1.25rem; padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 1.5rem; width: 100%;
        }
        .q-type-badge { display: inline-block; padding: 4px 12px; background: #dbeafe; color: var(--primary); border-radius: 20px; font-size: 0.8rem; margin-bottom: 1rem; }
        .q-text { font-size: 1.3rem; font-weight: 700; line-height: 1.5; margin-bottom: 2rem; }

        .options-list { display: grid; gap: 0.75rem; }
        .opt-btn {
            width: 100%; padding: 1rem 1.5rem; text-align: right; border: 2px solid #f1f5f9;
            border-radius: 0.75rem; background: #fff; cursor: pointer; font-size: 1rem;
        }
        .opt-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #065f46; font-weight: bold; }
        .opt-btn.wrong { background: #fee2e2 !important; border-color: var(--error) !important; color: #991b1b; }

        .action-btn { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 0.75rem; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
        .action-btn:disabled { background: #cbd5e1; cursor: not-allowed; opacity: 0.7; }

	/* ========================================= */
    /* التنسيق النهائي والمضمون للموبايل */
    /* ========================================= */
    @media (max-width: 768px) {
        body { 
            overflow-y: auto !important; 
            height: auto !important; 
        }

        #main-app { 
            display: flex !important; 
            flex-direction: column !important; /* ترتيب عمودي إجباري */
            height: auto !important;
            grid-template-columns: 1fr !important; /* إلغاء نظام الأعمدة */
        }

        /* 1. منطقة الأسئلة (تظهر أولاً) */
        .content { 
            order: 1 !important; 
            width: 100% !important;
            padding: 1rem !important;
            flex: none !important;
        }

        /* 2. منطقة خريطة الأسئلة (تظهر ثانياً تحت الأسئلة) */
        .sidebar { 
            order: 2 !important; 
            width: 100% !important; 
            border-left: none !important; 
            background: transparent !important; 
            padding: 1rem !important;
            display: block !important;
            height: auto !important;
        }

        .nav-scroll { 
            background: #ffffff !important; 
            border-radius: 1.5rem !important; 
            padding: 1.5rem !important; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05) !important;
            border: 1px solid #e2e8f0 !important;
        }

        .sidebar-header { 
            background: none !important; 
            color: var(--primary) !important; 
            text-align: center !important; 
            padding: 0 0 1rem 0 !important; 
            font-size: 1.2rem !important;
            display: block !important;
        }

        .nav-grid { 
            display: grid !important; 
            grid-template-columns: repeat(5, 1fr) !important; /* 5 مربعات في الصف */
            gap: 10px !important; 
        }

        .q-dot { 
            width: 100% !important; 
            aspect-ratio: 1 !important; 
            font-size: 1rem !important; 
            border-radius: 0.75rem !important; 
        }

        .timer-box { 
            width: 100% !important; 
            max-width: none !important;
        }

        .quiz-container {
            max-width: 100% !important;
        }
    }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h2 style="color: var(--primary); margin-top: 0;">اختبار الفيزياء 2026</h2>
        <input type="text" id="user-name" placeholder="أدخل اسمك الثلاثي">
        <button class="action-btn" onclick="initQuiz()">ابدأ الآن</button>
    </div>
</div>

<div id="main-app">
    <div class="sidebar">
        <div class="sidebar-header">خريطة الأسئلة</div>
        <div class="nav-scroll"><div id="nav-grid" class="nav-grid"></div></div>
    </div>

    <div class="content">
        <div id="quiz-ui" class="quiz-container">
            <div class="timer-box">
                <span> المتبقي:</span>
                <span id="timer-display">30:00</span>
            </div>
            <div class="question-card">
                <span id="q-type" class="q-type-badge"></span>
                <div id="q-text" class="q-text"></div>
                <div id="options-area" class="options-list"></div>
            </div>
            <button id="next-btn" class="action-btn" disabled onclick="handleNext()">السؤال التالي</button>
            <p id="alert-msg" style="color: #64748b; font-size: 0.85rem; margin-top: 10px; display: none;">⚠️ يجب الإجابة على جميع الأسئلة لتتمكن من الإنهاء.</p>
        </div>

        <div id="result-screen" class="question-card" style="display:none; text-align:center; padding:3rem;">
            <h2>انتهى الاختبار!</h2>
            <p id="student-display"></p>
            <div class="score-box" id="final-percent" style="font-size:4rem; color:var(--primary); font-weight:800;">0%</div>
            <p id="status-msg">جاري حفظ النتيجة...</p>
            <button class="action-btn" onclick="location.reload()">إعادة المحاولة</button>
        </div>
    </div>
</div>

<script>
// 1. التفتيش أول ما الصفحة تفتح (قبل أي حاجة)
window.onload = function() {
    if (localStorage.getItem("exam_finished") === "true") {
        document.body.innerHTML = `
            <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; font-family:Tajawal; text-align:center; padding:20px; background:#f8fafc;">
                <div style="background:white; padding:2rem; border-radius:1.5rem; box-shadow:0 10px 25px rgba(0,0,0,0.1); border-top:5px solid #dc2626;">
                    <h1 style="color:#dc2626; margin-bottom:10px;">⚠️ غير مسموح بالدخول</h1>
                    <p style="font-size:1.2rem; color:#1e293b;">لقد قمت بتأدية هذا الاختبار مسبقاً من هذا الجهاز.</p>
                    <hr style="border:0; border-top:1px solid #e2e8f0; margin:20px 0;">
                    <b style="color:#2563eb; font-size:1.3rem;">مستر / محمد سمير زكي</b>
                </div>
            </div>`;
    }
};
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwKDDFLUW6jlvSit4hqeDh8liepIrUZ8WzcZYJvW7C9eVtLz_4hOIAs2YfHWAWwE2lX/exec";
const EXAM_DURATION_MINUTES = 30;

const rawQuestions = [
    // --- 1. قسم الصح والخطأ (40 سؤال) ---
    {cat: "صح أم خطأ", q: "الشحنات الكهربائية المتشابهة تتجاذب، والمختلفة تتنافر.", o: ["صح", "خطأ"], c: "خطأ"},
    {cat: "صح أم خطأ", q: "وحدة قياس الشحنة الكهربائية في النظام الدولي هي الكولوم.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "الجسم الذي يفقد الكترونات يصبح مشحوناً بشحنة سالبة.", o: ["صح", "خطأ"], c: "خطأ"},
    {cat: "صح أم خطأ", q: "الشحن بالدلك يتطلب تلامس واحتكاك الأجسام ببعضها.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "تتناسب القوة الكهربائية طردياً مع مربع المسافة بين الشحنتين.", o: ["صح", "خطأ"], c: "خطأ"},
    {cat: "صح أم خطأ", q: "خطوط المجال الكهربائي لا تتقاطع أبداً.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "اتجاه المجال الكهربائي لشحنة موجبة يكون دائماً نحو الخارج.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "الجهد الكهربائي عند نقطة هو مقدار الشغل المبذول لنقل وحدة شحنات من مالانهاية للنقطة.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "تزداد سعة المكثف بزيادة المساحة المتقابلة للوحيه.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "تقاس سعة المكثف بوحدة الفاراد.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "في توصيل المكثفات على التوازي يكون فرق الجهد متساوي لجميع المكثفات.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "في توصيل المكثفات على التوالي تكون الشحنة متساوية لجميع المكثفات.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "التيار الكهربائي هو سيل من الشحنات تسري عبر موصل.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "جهاز الفولتميتر يوصل في الدائرة على التوالي.", o: ["صح", "خطأ"], c: "خطأ"},
    {cat: "صح أم خطأ", q: "المقاومة النوعية تعتمد فقط على نوع المادة ودرجة الحرارة.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "التوصيلية الكهربية هي مقلوب المقاومة النوعية.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "تزداد مقاومة الموصل بزيادة طوله.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "تقاس المقاومة الكهربائية بوحدة الأوم.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "كثافة الفيض المغناطيسي تقاس بوحدة التسلا.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "قاعدة أمبير لليد اليمنى تستخدم لتحديد اتجاه القوة المغناطيسية.", o: ["صح", "خطأ"], c: "خطأ"},
    {cat: "صح أم خطأ", q: "تزداد التوصيلية الكهربية لشبه الموصل برفع درجة حرارته.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "الوصلة الثنائية تستخدم في تقويم التيار المتردد.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "في التوصيل الأمامي للوصلة الثنائية يكون الجهد الحاجز كبيراً.", o: ["صح", "خطأ"], c: "خطأ"},
    {cat: "صح أم خطأ", q: "الترانزستور يعمل كمكبر للتيار والجهد.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "الأشعة السينية لا تتأثر بالمجالات الكهربائية أو المغناطيسية.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "فوتونات الليزر غير مترابطة زمانياً ومكانياً.", o: ["صح", "خطأ"], c: "خطأ"},
    {cat: "صح أم خطأ", q: "ليزر الهيليوم نيون يعتبر من ليزرات الحالة الصلبة.", o: ["صح", "خطأ"], c: "خطأ"},
    {cat: "صح أم خطأ", q: "في بوابة AND يجب أن تكون جميع المدخلات 1 ليعطي المخرج 1.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "بوابة NOT تسمى البوابة العاكسة.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "الشحن بالتأثير يزول بزوال المؤثر.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "تقاس شدة التيار الكهربائي بوحدة الأمبير.", o: ["صح", "خطأ"], c: "صح"},
    {cat: "صح أم خطأ", q: "يتم تطعيم السيليكون بعنصر خماسي للحصول على بلورة n-type.", o: ["صح", "خطأ"], c: "صح"},

    // --- 2. قسم المصطلح العلمي (40 سؤال) ---
    {cat: "مصطلح علمي", q: "المنطقة المحيطة بالشحنة الكهربائية والتي تظهر فيها آثار قوتها الكهربائية:", o: ["المجال الكهربائي", "الجهد الكهربائي", "السعة الكهربائية"], c: "المجال الكهربائي"},
    {cat: "مصطلح علمي", q: "النسبة بين الشحنة المخزنة على المكثف إلى فرق الجهد بين لوحيه:", o: ["المقاومة", "سعة المكثف", "كثافة الفيض"], c: "سعة المكثف"},
    {cat: "مصطلح علمي", q: "مقلوب المقاومة النوعية لمادة الموصل:", o: ["التوصيلية الكهربائية", "المقاومة الكهربائية", "السعة"], c: "التوصيلية الكهربائية"},
    {cat: "مصطلح علمي", q: "كمية الشحنة الكهربائية التي تمر عبر مقطع موصل في زمن قدره ثانية واحدة:", o: ["شدة التيار", "فرق الجهد", "المقاومة"], c: "شدة التيار"},
    {cat: "مصطلح علمي", q: "النقطة التي ينعدم عندها المجال الكهربائي بين شحنتين:", o: ["نقطة التعادل", "المركز الكهربي", "القطب"], c: "نقطة التعادل"},
    {cat: "مصطلح علمي", q: "مقاومة موصل طوله 1 متر ومساحة مقطعه 1 متر مربع عند درجة حرارة معينة:", o: ["المقاومة النوعية", "التوصيلية", "المقاومة المكافئة"], c: "المقاومة النوعية"},
    {cat: "مصطلح علمي", q: "جهاز يستخدم لقياس فرق الجهد الكهربائي في الدائرة:", o: ["الأميتر", "الفولتميتر", "الأومميتر"], c: "الفولتميتر"},
    {cat: "مصطلح علمي", q: "وحدة قياس شدة المجال المغناطيسي (كثافة الفيض):", o: ["الويبر", "التسلا", "نيوتن"], c: "التسلا"},
    {cat: "مصطلح علمي", q: "فرع الفيزياء الذي يتعامل مع الأنظمة الإلكترونية بنظام العد الثنائي (0,1):", o: ["الإلكترونيات الرقمية", "الإلكترونيات التناظرية", "الكهرباء"], c: "الإلكترونيات الرقمية"},
    {cat: "مصطلح علمي", q: "دوائر إلكترونية تقوم بعمليات منطقية مبنية على الجبر الثنائي:", o: ["البوابات المنطقية", "الترانزستورات", "المكثفات"], c: "البوابات المنطقية"},
    {cat: "مصطلح علمي", q: "حالة الوسط الفعال التي يكون فيها عدد الذرات في مستويات الإثارة العليا أكبر من الدنيا:", o: ["الإسكان المعكوس", "الانبعاث التلقائي", "النقاء الطيفي"], c: "الإسكان المعكوس"},
    {cat: "مصطلح علمي", q: "أشعة كهرومغناطيسية غير مرئية ذات طول موجي قصير جداً ولها قدرة اختراق عالية:", o: ["الأشعة السينية", "أشعة الليزر", "أشعة كاثود"], c: "الأشعة السينية"},
    {cat: "مصطلح علمي", q: "المنطقة الفاصلة بين البلورة P والبلورة N وتخلو من حاملات الشحنة الحرة:", o: ["المنطقة القاحلة", "منطقة القاعدة", "المجمع"], c: "المنطقة القاحلة"},
    {cat: "مصطلح علمي", q: "قاعدة تستخدم لتحديد اتجاه المجال المغناطيسي الناشئ عن تيار في سلك مستقيم:", o: ["اليد اليمنى لأمبير", "فلمنج لليسرى", "لينز"], c: "اليد اليمنى لأمبير"},
    {cat: "مصطلح علمي", q: "مقدار الشغل المبذول لنقل شحنة مقدارها 1 كولوم بين نقطتين:", o: ["فرق الجهد", "شدة التيار", "المقاومة"], c: "فرق الجهد"},

let quizData = [], currentStep = 0, userScore = 0, answersLog = [], studentName = "";
let timeLeft = EXAM_DURATION_MINUTES * 60;
let timerInterval;

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startTimer() {
    const display = document.getElementById('timer-display');
    timerInterval = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        display.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert("⚠️ انتهى الوقت! يتم الآن إرسال إجاباتك أوتوماتيكياً.");
            finishQuiz(true); // تمرير true ليعرف السيستم أنه إنهاء إجباري بسبب الوقت
        }
        timeLeft--;
    }, 1000);
}

function initQuiz() {
    studentName = document.getElementById('user-name').value.trim();
    if(studentName.length < 3) return alert("يرجى كتابة الاسم الثلاثي");
    quizData = shuffleArray([...rawQuestions]);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'grid';
    renderNav();
    loadQuestion();
    startTimer();
}

function renderNav() {
    const grid = document.getElementById('nav-grid');
    grid.innerHTML = quizData.map((_, i) => `<div class="q-dot" id="dot-${i}" onclick="jumpTo(${i})">${i + 1}</div>`).join('');
}

function loadQuestion() {
    const data = quizData[currentStep];
    document.getElementById('q-type').innerText = data.cat || "سؤال"; 
    document.getElementById('q-text').innerText = data.q;
    const area = document.getElementById('options-area');
    area.innerHTML = "";
    
    const hasAnswered = answersLog[currentStep] !== undefined;
    const isLast = currentStep === quizData.length - 1;
    const totalAnswered = answersLog.filter(x => x !== undefined).length;
    const allDone = totalAnswered === quizData.length;

    // تحديث زر التالي/إنهاء
    const nextBtn = document.getElementById('next-btn');
    const alertMsg = document.getElementById('alert-msg');

    if (isLast) {
        nextBtn.innerText = "إنهاء الاختبار";
        nextBtn.disabled = !allDone; // لا يعمل إلا إذا تم حل الكل
        alertMsg.style.display = allDone ? "none" : "block";
    } else {
        nextBtn.innerText = "السؤال التالي";
        nextBtn.disabled = !hasAnswered;
        alertMsg.style.display = "none";
    }

    if (!data.shuffledOptions) data.shuffledOptions = shuffleArray([...data.o]);
    data.shuffledOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        if (hasAnswered) {
            btn.disabled = true;
            if (opt === data.c) btn.classList.add('correct');
            if (opt === answersLog[currentStep].selected && opt !== data.c) btn.classList.add('wrong');
        } else {
            btn.onclick = () => selectOption(opt);
        }
        area.appendChild(btn);
    });

    document.querySelectorAll('.q-dot').forEach(d => d.classList.remove('active'));
    document.getElementById(`dot-${currentStep}`).classList.add('active');
}

function selectOption(val) {
    if(answersLog[currentStep] !== undefined) return;
    const isCorrect = val === quizData[currentStep].c;
    if(isCorrect) userScore++;
    answersLog[currentStep] = { selected: val, isCorrect: isCorrect };
    document.getElementById(`dot-${currentStep}`).classList.add(isCorrect ? 'correct' : 'wrong');
    loadQuestion(); 
}

function handleNext() {
    if(currentStep < quizData.length - 1) {
        currentStep++; loadQuestion();
    } else {
        finishQuiz(false);
    }
}

function jumpTo(i) { currentStep = i; loadQuestion(); }

function saveResultToSheet(name, score, wrongList) {
    const statusMsg = document.getElementById('status-msg');
    const wrongAnswersText = wrongList.length > 0 ? wrongList.map((q, i) => `${i+1}- ${q}`).join(" | ") : "ممتاز";
    fetch(SCRIPT_URL, {
        method: 'POST', mode: 'no-cors', cache: 'no-cache',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, score: score, wrongAnswers: wrongAnswersText })
    }).then(() => {
        statusMsg.innerText = "تم حفظ النتيجة بنجاح ✅";
        statusMsg.style.color = "var(--success)";
    });
}

function finishQuiz(isForce) {
    // التأكد من حل كل الأسئلة لو الإغلاق يدوي
    if(!isForce && answersLog.filter(x => x !== undefined).length < quizData.length) {
        alert("يرجى الإجابة على جميع الأسئلة أولاً!");
        return;
    }
	// --- الختم على المتصفح لمنع الدخول مرة أخرى ---
    localStorage.setItem("exam_finished", "true");

    clearInterval(timerInterval);
    document.getElementById('quiz-ui').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    
    const percent = Math.round((userScore / quizData.length) * 100);
    document.getElementById('final-percent').innerText = percent + "%";
    document.getElementById('student-display').innerText = `الطالب: ${studentName}`;
    
    let wrongList = [];
    answersLog.forEach((log, index) => {
        if (log && !log.isCorrect) wrongList.push(quizData[index].q);
    });
    saveResultToSheet(studentName, percent, wrongList);
}

</script>
